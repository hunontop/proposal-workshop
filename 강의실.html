 padding-top:10px;border-top:1px dashed var(--line)}

, "t": null}, {"no": "12-2", "title": "손과 공정 · 스킬로 굳히기", "slides": "60~61장", "t": null}, {"no": "12-3", "title": "과정에서 손에 든 것 · 마무리", "slides": "62~64장", "t": null}], "files": []}]</script><script type="application/json" id="clip">["## 기본 정보\n\n| 항목 | 내용 |\n|---|---|\n| 이름 | 김하늘 (34세) |\n| 상태 | **예비창업자** (법인·사업자등록 아직 없음, 올해 안 설립 목표) |\n| 경력 | 요양서비스 기업 운영기획 8년 (재가요양 센터 운영 관리·지자체 복지사업 협력 담당) |\n| 팀 | 본인 + 개발자 1명(파트타임 합류 예정) |\n| 지역 | 대전 |\n\n## 창업 아이템 — \"말벗ON\"\n\n- **무엇**: 독거 어르신 대상 **AI 전화 말벗 + 복약·안부 알림** 서비스. 매일 정해진 시간에 AI가 전화를 걸어 안부 대화를 나누고, 복약 여부를 확인하고, 이상 신호(무응답·건강 호소)를 보호자와 지자체 복지 담당자에게 알린다.\n- **해결하려는 사회문제**: 고령 1인가구의 고독과 돌봄 공백. 복지 인력 1명이 담당하는 독거 어르신이 너무 많아 주 1회 안부 확인도 어렵다.\n- **어떻게 다른가**: 단순 안부 문자·로봇이 아니라, 지역 요양 현장 경험을 바탕으로 **지자체 복지망과 연계**하는 운영 설계가 핵심이라고 생각한다.\n\n## 진행 현황\n\n- 프로토타입으로 어르신 **30명 파일럿** 진행 중 (지역 복지관 1곳 협력)\n- 파일럿에서 반응은 좋았다고 느끼지만, **정리된 수치는 아직 없다**\n- 특허는 준비 중 (출원 전)\n\n## 올해 목표\n\n1. 법인 설립\n2. 초기 사업화 자금·보증 확보\n3. 파일럿을 복지관 3곳으로 확대\n\n## ⚠ 비어 있는 칸 (채우지 말 것 — 모르는 값은 모르는 값)\n\n| 항목 | 상태 |\n|---|---|\n| 매출·재무제표 | **없음** (예비창업자) |\n| 파일럿 정량 성과 (만족도·응답률 수치) | **미정리** |\n| 특허 출원번호 | **없음** (출원 전) |\n| 개발자 이력 상세 | **미확정** |\n| 자기부담금 가용 예산 | **미정** |", "[맥락]  우리 회사는 ______________________ 입니다.\n        지금 하려는 일은 ______________________ 입니다.\n\n[역할]  ______________________ 의 입장에서 답해 주세요.\n\n[예시]  결과는 ______________________ 모양으로 주세요.\n\n[제약]  ______________________ 이내로.\n        ______________________ 는 하지 마세요.\n        확실하지 않은 값은 지어내지 말고 \"(모름)\"이라고 적어 주세요.\n\n[요청]  ______________________", "우리 회사에 맞는 지원사업 알려줘", "[맥락]  저는 예비창업자입니다. 법인·사업자등록은 아직 없고 올해 안 설립이 목표입니다.\n        독거 어르신 대상 AI 전화 말벗·복약 알림 서비스를 준비하고 있고, 대전에 있습니다.\n        어르신 30명 규모 파일럿을 복지관 1곳과 진행 중입니다.\n\n[역할]  지원사업 심사 경험이 있는 실무자의 입장에서 답해 주세요.\n\n[예시]  표로 주세요. 열은 [사업명 / 주관 / 신청자격 충족 여부 / 왜 맞는지 / 걸리는 점].\n\n[제약]  5건 이내.\n        마감일·지원금액은 확실하지 않으면 지어내지 말고 \"(확인 필요)\"라고 적어 주세요.\n        제가 드린 정보에 없는 것은 \"(카드에 없음)\"으로 표시해 주세요.\n\n[요청]  지금 지원할 만한 사업을 골라 주세요."]</script><script type="text/plain" id="ic"><svg class="ic ic-c" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><svg class="ic ic-d" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></script><script>
(function(){
  var D = JSON.parse(document.getElementById("d").textContent),
      T = JSON.parse(document.getElementById("clip").textContent),
      IC = document.getElementById("ic").textContent,
      K = "pw-seen", cur = null, seen = {};
  function put(s){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
    var a = document.createElement("textarea");          // file:// · 구형 폴백
    a.value = s; a.setAttribute("readonly", "");
    a.style.cssText = "position:fixed;top:-9999px";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } finally { document.body.removeChild(a); }
  }
  document.addEventListener("click", function(ev){
    var b = ev.target.closest && ev.target.closest(".cp");
    if (!b) return;
    put(T[+b.dataset.i]);
    b.classList.add("done");
    setTimeout(function(){ b.classList.remove("done"); }, 1200);
  });
  try { seen = JSON.parse(localStorage.getItem(K) || "{}") || {}; } catch(e) {}
  function save(){ try { localStorage.setItem(K, JSON.stringify(seen)); } catch(e) {} }
  function mmss(n){
    var h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60,
        p = function(x){ return (x < 10 ? "0" : "") + x; };
    return (h ? h + ":" + p(m) : m) + ":" + p(s);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function paint(){
    [].forEach.call(document.querySelectorAll(".ep"), function(b){
      b.setAttribute("aria-current", String(cur === b.dataset.n));
      b.classList.toggle("seen", !!seen[b.dataset.n]);
    });
  }
  function show(n){
    var e = D.filter(function(x){ return String(x.n) === String(n); })[0];
    if (!e) return;
    cur = String(n);
    var f = document.getElementById("frame");
    if (e.vid) {
      f.innerHTML = '<iframe src="https://www.youtube.com/embed/' + e.vid +
        '?rel=0&modestbranding=1" title="' + esc(e.n) + '\uD3B8" allowfullscreen ' +
        'allow="accelerometer;clipboard-write;encrypted-media;picture-in-picture"></iframe>';
      seen[cur] = 1; save();
    } else {
      f.innerHTML = '<div class="blank"><b>\uCD2C\uC601 \uC900\uBE44 \uC911\uC785\uB2C8\uB2E4</b>' +
        '<span>\uC774 \uD3B8\uC758 \uCC28\uB840\uC640 \uC790\uB8CC\uB294 ' +
        '\uC544\uB798\uC5D0\uC11C \uBBF8\uB9AC \uBCF4\uC2E4 \uC218 \uC788\uC2B5\uB2C8\uB2E4.</span></div>';
    }
    document.getElementById("mt").textContent = e.n + "\uD3B8 \u00B7 " + e.title;
    document.getElementById("ms").textContent = e.dur || "";
    document.getElementById("mc").innerHTML = e.chapters.map(function(c){
      var jump = (e.vid && c.t != null)
        ? '<a href="https://www.youtube.com/watch?v=' + e.vid + '&t=' + c.t + 's" target="_blank" rel="noopener">' + esc(c.title) + '</a>'
        : esc(c.title);
      var mark = (c.t != null) ? mmss(c.t) : c.slides;   // 시간이 들어오면 장 번호를 밀어낸다
      return '<div class="ch"><em>' + esc(c.no) + '</em><span>' + jump + '</span><i>' + esc(mark) + '</i></div>';
    }).join("");
    document.getElementById("mf").innerHTML = e.files.length
      ? e.files.map(function(x){
          var a = '<a href="' + x.href + '">' + esc(x.title) + '</a>';
          if (!x.copy || !x.copy.length) return a;
          var b = x.copy.map(function(c){
            return '<button class="cp" type="button" data-i="' + c.i + '" title="\uBCF5\uC0AC: ' +
                   esc(c.lab) + '">' + IC + '<span>' + esc(c.lab) + '</span></button>';
          }).join("");
          return a + '<div class="matrow">' + b + '</div>';
        }).join("")
      : '<p>\uC774 \uD3B8\uC5D0\uB294 \uB530\uB85C \uB0B4\uB824\uBC1B\uC744 \uC790\uB8CC\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</p>';
    paint();
    if (location.hash !== "#" + n) history.replaceState(null, "", "#" + n);
  }
  [].forEach.call(document.querySelectorAll(".ep"), function(b){
    b.addEventListener("click", function(){ show(b.dataset.n); });
  });
  var first = D.filter(function(x){ return x.vid; })[0];
  show((location.hash || "").replace("#", "") || (first ? first.n : 1));
})();
</script></body></html>
